<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7fb"><title>Match Point</title><style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#172033;--muted:#7c8494;--line:#e7e9ef;--accent:#5c6ac4;--soft:#eef0ff;--danger:#b95361;--shadow:0 10px 30px rgba(30,40,70,.07)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:760px;margin:auto;padding:20px 16px 92px}.top,.section-head,.person-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand h1{font-size:25px;margin:0}.brand p,.note,.muted{color:var(--muted)}.brand p{font-size:13px;margin:4px 0 0}.month-nav{display:flex;align-items:center;gap:6px}.month-nav button{border:1px solid var(--line);background:#fff;border-radius:12px;width:42px;height:42px;font-size:22px}.month-label{min-width:92px;text-align:center;font-weight:800}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin:12px 0}.card h2{font-size:16px;margin:0 0 12px}.metric-grid,.counter-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric,.counter-card{background:#fafbff;border:1px solid var(--line);border-radius:16px;padding:13px}.metric span,.counter-card label{display:block;color:var(--muted);font-size:12px;font-weight:800}.metric strong{display:block;font-size:24px;margin:4px 0}.metric small{color:var(--muted)}.stepper{display:grid;grid-template-columns:42px 1fr 42px;gap:7px;align-items:center;margin-top:9px}.stepper button{border:0;border-radius:11px;height:42px;background:var(--soft);color:var(--accent);font-size:23px;font-weight:800}.stepper input{width:100%;height:42px;text-align:center;border:1px solid var(--line);border-radius:11px;background:#fff;font-size:20px;font-weight:800;color:var(--ink)}.full{grid-column:1/-1}textarea,select,input.text,.edit-row input{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px;font:inherit;color:var(--ink)}textarea{min-height:82px;resize:vertical}.primary,.edit-toggle{width:100%;border:0;background:var(--accent);color:#fff;border-radius:14px;padding:13px;font-weight:800;font-size:15px}.secondary{width:100%;border:1px solid var(--line);background:#fff;color:var(--accent);border-radius:14px;padding:12px;font-weight:800}.save-note{text-align:center;color:var(--muted);font-size:11px;margin:10px 0 0}.rate-row{display:grid;grid-template-columns:1fr auto;gap:10px;margin:11px 0;font-size:13px}.insight{background:#f7f8fc;border-radius:14px;padding:13px;font-size:13px;line-height:1.6;white-space:pre-wrap}.person{border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px}.person-title{font-weight:800}.pill{font-size:11px;border-radius:999px;padding:5px 9px;background:var(--soft);color:var(--accent);font-weight:800}.person p{font-size:13px;line-height:1.55;margin:8px 0 0}.actions{display:flex;gap:8px;margin-top:10px}.actions button,.section-head button{border:0;background:none;color:var(--accent);font-weight:800}.actions .danger,.danger{color:var(--danger)}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.form-grid label{font-size:12px;color:var(--muted);font-weight:800}.chart{display:flex;align-items:flex-end;gap:10px;height:150px;padding:10px 2px 22px;border-bottom:1px solid var(--line);overflow-x:auto}.bar-wrap{min-width:46px;text-align:center;position:relative;height:100%}.bar{position:absolute;left:8px;right:8px;bottom:0;background:var(--accent);border-radius:8px 8px 3px 3px;min-height:2px}.bar-wrap b{position:absolute;bottom:-20px;left:0;right:0;font-size:10px;color:var(--muted)}.bar-wrap em{position:absolute;left:0;right:0;font-style:normal;font-size:10px;transform:translateY(-16px)}.edit-panel{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}.edit-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin:8px 0}.edit-row button{border:0;background:none;color:var(--danger);font-weight:800}.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.95);border-top:1px solid var(--line);backdrop-filter:blur(14px);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}.tabs-inner{width:min(760px,100%);display:grid;grid-template-columns:repeat(3,1fr)}.tab{border:0;background:none;padding:14px 4px;color:var(--muted);font-weight:800}.tab.active{color:var(--accent)}.page{display:none}.page.active{display:block}.hide{display:none}.empty{text-align:center;color:var(--muted);font-size:13px;padding:18px 0}.note{font-size:12px;line-height:1.55}@media(min-width:620px){.metric-grid{grid-template-columns:repeat(4,1fr)}.counter-grid{grid-template-columns:repeat(3,1fr)}.form-grid{grid-template-columns:repeat(4,1fr)}}</style></head><body><div class="app">
<div class="top"><div class="brand"><h1>Match Point</h1><p>結果より、傾向を見る。</p></div><div class="month-nav"><button id="prevMonth">‹</button><div id="monthLabel" class="month-label"></div><button id="nextMonth">›</button></div></div>
<section id="pageMonthly" class="page active"><div class="card"><h2>今月の流れ</h2><div class="metric-grid"><div class="metric"><span>消費いいね</span><strong id="mUsed">0</strong><small>送った数</small></div><div class="metric"><span>マッチ</span><strong id="mMatches">0</strong><small id="mMatchRate">0%</small></div><div class="metric"><span>会話継続</span><strong id="mChats">0</strong><small id="mChatRate">0%</small></div><div class="metric"><span>会った</span><strong id="mDates">0</strong><small id="mDateRate">0%</small></div></div></div>
<div class="card"><h2>月間データ</h2><div class="counter-grid" id="counters"></div><p class="save-note">＋ / − は押した瞬間に保存。数字をタップして直接入力もできます。</p><div style="margin-top:14px"><label style="font-size:12px;color:var(--muted);font-weight:800">月のひとこと</label><textarea id="monthMemo"></textarea><p class="save-note">入力内容は自動保存されます</p></div><div id="monthlyRates" style="margin-top:14px"></div></div><div class="card"><h2>今月の見方</h2><div id="monthlyInsight" class="insight"></div></div><div class="card"><button class="edit-toggle" id="editModeBtn">編集モード</button><div id="editPanel" class="edit-panel hide"><p class="note">カウント項目の名前変更・追加・削除ができます。基本の5項目も名前変更できます。</p><div id="editItems"></div><button class="secondary" id="addItem">＋ カウント項目を追加</button></div></div></section>
<section id="pagePeople" class="page"><div class="card"><div class="section-head"><h2>会った人の振り返り</h2><button id="newPerson">＋追加</button></div><p class="note">本名ではなく「Aさん」「8月①」などで十分。</p><div id="peopleList"></div></div><div id="personFormCard" class="card hide"><h2 id="personFormTitle">記録を追加</h2><div class="form-grid"><label class="full">呼び名<input class="text" id="pName"></label><label class="full">いいねした理由<textarea id="pWhy"></textarea></label><label class="full">会う前に良かった点<textarea id="pBefore"></textarea></label><label class="full">会って良かった点<textarea id="pGood"></textarea></label><label class="full">違った点<textarea id="pGap"></textarea></label><label>自分はまた会いたい？<select id="pMe"><option>保留</option><option>会いたい</option><option>どちらでも</option><option>会わない</option></select></label><label>相手の反応<select id="pThem"><option>不明</option><option>前向き</option><option>普通</option><option>弱め</option></select></label><label class="full">学び<textarea id="pLearn"></textarea></label><div class="full"><button class="primary" id="savePerson">保存</button></div></div></div></section>
<section id="pageTrend" class="page"><div class="card"><h2>月ごとの会えた人数</h2><div id="dateChart" class="chart"></div></div><div class="card"><h2>月ごとのマッチ率</h2><div id="matchChart" class="chart"></div></div></section></div>
<nav class="tabs"><div class="tabs-inner"><button class="tab active" data-page="pageMonthly">月間</button><button class="tab" data-page="pagePeople">会った人</button><button class="tab" data-page="pageTrend">推移</button></div></nav>
<script>
const KEY='matchpoint_v2';const OLD='matchpoint_v1';let state=JSON.parse(localStorage.getItem(KEY)||'null');if(!state){const old=JSON.parse(localStorage.getItem(OLD)||'{"months":{}}');state={months:old.months||{},items:[{id:'likesUsed',label:'消費いいね数'},{id:'matches',label:'マッチ数'},{id:'chats',label:'会話継続数'},{id:'dates',label:'会った人数'},{id:'secondDates',label:'2回目人数'}]};}
let cursor=new Date();cursor.setDate(1);let editingPerson=null;const $=id=>document.getElementById(id),ym=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,monthName=d=>`${d.getFullYear()}年${d.getMonth()+1}月`,pct=(a,b)=>b?`${Math.round(a/b*100)}%`:'0%';function save(){localStorage.setItem(KEY,JSON.stringify(state))}function getMonth(){const k=ym(cursor);if(!state.months[k])state.months[k]={likesUsed:0,matches:0,chats:0,dates:0,secondDates:0,memo:'',people:[],custom:{}};const m=state.months[k];m.people=m.people||[];m.custom=m.custom||{};return m}
function val(m,id){return ['likesUsed','matches','chats','dates','secondDates'].includes(id)?(+m[id]||0):(+m.custom[id]||0)}function setVal(m,id,v){v=Math.max(0,+v||0);if(['likesUsed','matches','chats','dates','secondDates'].includes(id))m[id]=v;else m.custom[id]=v}
function buildCounters(){const m=getMonth();$('counters').innerHTML=state.items.map(it=>`<div class="counter-card"><label>${esc(it.label)}</label><div class="stepper"><button data-id="${it.id}" data-d="-1">−</button><input id="cnt_${it.id}" type="number" min="0" value="${val(m,it.id)}" inputmode="numeric"><button data-id="${it.id}" data-d="1">＋</button></div></div>`).join('');document.querySelectorAll('.stepper button').forEach(b=>b.onclick=()=>{setVal(m,b.dataset.id,val(m,b.dataset.id)+(+b.dataset.d));save();render()});state.items.forEach(it=>{const n=$('cnt_'+it.id);if(n)n.onchange=()=>{setVal(m,it.id,n.value);save();render()}})}
function render(){const m=getMonth();$('monthLabel').textContent=monthName(cursor);$('mUsed').textContent=m.likesUsed||0;$('mMatches').textContent=m.matches||0;$('mMatchRate').textContent=`マッチ率 ${pct(m.matches,m.likesUsed)}`;$('mChats').textContent=m.chats||0;$('mChatRate').textContent=`継続率 ${pct(m.chats,m.matches)}`;$('mDates').textContent=m.dates||0;$('mDateRate').textContent=`会えた率 ${pct(m.dates,m.chats)}`;buildCounters();$('monthMemo').value=m.memo||'';$('monthlyRates').innerHTML=`<div class="rate-row"><span>いいね → マッチ</span><strong>${pct(m.matches,m.likesUsed)}</strong></div><div class="rate-row"><span>マッチ → 会話継続</span><strong>${pct(m.chats,m.matches)}</strong></div><div class="rate-row"><span>会話継続 → 会う</span><strong>${pct(m.dates,m.chats)}</strong></div><div class="rate-row"><span>初回 → 2回目</span><strong>${pct(m.secondDates,m.dates)}</strong></div>`;$('monthlyInsight').textContent=m.likesUsed>=20?(m.matches/m.likesUsed<.08?'今月は入口のマッチ率が低め。写真・プロフィール・いいねする相手の範囲を見直す候補です。':'1人の結果より、3か月ほどの傾向で判断していきましょう。'):'まだデータが少ない月です。まずは事実だけ記録していきましょう。';renderPeople();renderCharts();renderEdit()}
function renderEdit(){$('editItems').innerHTML=state.items.map((it,i)=>`<div class="edit-row"><input value="${esc(it.label)}" data-i="${i}"><button data-del="${i}">削除</button></div>`).join('');document.querySelectorAll('#editItems input').forEach(x=>x.onchange=()=>{state.items[+x.dataset.i].label=x.value.trim()||state.items[+x.dataset.i].label;save();render()});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(state.items.length<=1)return alert('1項目は残してください');state.items.splice(+b.dataset.del,1);save();render()})}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function renderPeople(){const a=getMonth().people;$('peopleList').innerHTML=a.length?a.map((p,i)=>`<div class="person"><div class="person-top"><div><div class="person-title">${esc(p.name||`記録${i+1}`)}</div><div class="muted" style="font-size:12px">自分：${esc(p.me)} / 相手：${esc(p.them)}</div></div><span class="pill">${esc(p.me)}</span></div>${p.why?`<p><b>惹かれた理由：</b>${esc(p.why)}</p>`:''}${p.learn?`<p><b>学び：</b>${esc(p.learn)}</p>`:''}<div class="actions"><button onclick="editPerson(${i})">編集</button><button class="danger" onclick="deletePerson(${i})">削除</button></div></div>`).join(''):'<div class="empty">まだ記録はありません</div>'}function renderCharts(){const e=Object.entries(state.months).sort(([a],[b])=>a.localeCompare(b)).slice(-8);chart('dateChart',e.map(([k,m])=>({label:k.slice(5),value:+m.dates||0})));chart('matchChart',e.map(([k,m])=>({label:k.slice(5),value:m.likesUsed?Math.round(m.matches/m.likesUsed*100):0})),true)}function chart(id,data,p=false){if(!data.length){$(id).innerHTML='<div class="empty">データがたまると表示されます</div>';return}const max=Math.max(...data.map(x=>x.value),p?20:1);$(id).innerHTML=data.map(x=>`<div class="bar-wrap"><div class="bar" style="height:${Math.max(2,x.value/max*100)}%"><em>${x.value}${p?'%':''}</em></div><b>${x.label}月</b></div>`).join('')}
$('editModeBtn').onclick=()=>$('editPanel').classList.toggle('hide');$('addItem').onclick=()=>{const name=prompt('追加するカウント項目名');if(!name)return;state.items.push({id:'custom_'+Date.now(),label:name.trim()});save();render();$('editPanel').classList.remove('hide')};$('prevMonth').onclick=()=>{cursor.setMonth(cursor.getMonth()-1);render()};$('nextMonth').onclick=()=>{cursor.setMonth(cursor.getMonth()+1);render()};$('monthMemo').oninput=()=>{getMonth().memo=$('monthMemo').value;save()};$('newPerson').onclick=()=>{editingPerson=null;['pName','pWhy','pBefore','pGood','pGap','pLearn'].forEach(id=>$(id).value='');$('pMe').value='保留';$('pThem').value='不明';$('personFormCard').classList.remove('hide')};window.editPerson=i=>{const p=getMonth().people[i];editingPerson=i;$('pName').value=p.name||'';$('pWhy').value=p.why||'';$('pBefore').value=p.before||'';$('pGood').value=p.good||'';$('pGap').value=p.gap||'';$('pMe').value=p.me||'保留';$('pThem').value=p.them||'不明';$('pLearn').value=p.learn||'';$('personFormCard').classList.remove('hide')};window.deletePerson=i=>{if(confirm('削除しますか？')){getMonth().people.splice(i,1);save();render()}};$('savePerson').onclick=()=>{const p={name:$('pName').value.trim(),why:$('pWhy').value.trim(),before:$('pBefore').value.trim(),good:$('pGood').value.trim(),gap:$('pGap').value.trim(),me:$('pMe').value,them:$('pThem').value,learn:$('pLearn').value.trim()};const a=getMonth().people;editingPerson===null?a.push(p):a[editingPerson]=p;save();$('personFormCard').classList.add('hide');render()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.page).classList.add('active')});save();render();
</script></body></html>
